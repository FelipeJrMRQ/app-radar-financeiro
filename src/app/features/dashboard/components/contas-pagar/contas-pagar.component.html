<section class="panel due-panel" aria-labelledby="titulo-pagar">
                <div class="panel-head"><div><span class="eyebrow">COMPROMISSOS</span><h2 id="titulo-pagar">Contas a pagar</h2></div>
                  <a routerLink="/lancamentos" class="panel-link"
                     [queryParams]="{ tipo: 'DESPESA', mes: mesReferencia() }">Ver lançamentos →</a></div>
                @if (itens().length === 0) {
                  <p class="empty-data">Nenhum pagamento pendente neste período.</p>
                } @else {
                  <div class="due-list">
                    @for (item of itens(); track item.lancamentoId) {
                      <div class="due-row">
                        <time class="date-block" [attr.datetime]="item.vencimento"
                          [attr.title]="dataCompleta(item.vencimento)"
                          [attr.aria-label]="'Vencimento: ' + dataCompleta(item.vencimento)">
                          {{ data(item.vencimento) }}
                        </time>
                        <div class="due-description">
                          <strong>{{ item.descricao }}</strong>
                          @if (item.atrasado) { <span class="late-label">Atrasado</span> }
                        </div>
                        <div class="due-end"><strong class="due-value expense-text">{{ moeda(item.valorRestante) }}</strong>
                        <app-lancamento-acoes [lancamentoId]="item.lancamentoId" (alterado)="alterado.emit()" />
                        </div>
                      </div>
                    }
                  </div>
                }
                
              </section>
